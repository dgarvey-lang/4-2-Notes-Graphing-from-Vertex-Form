<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-2 Notes Graphing from Vertex Form</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered column, one step at a time, graph paper card + controls below */
:root {
  --bg: #f3f6f8;
  --paper: #ffffff;
  --ink: #1d2a33;
  --muted: #5b6b76;
  --grid: #e1e8ed;
  --axis: #8a9aa5;
  --parent: #a3b1ba;
  --accent: #1f6fd1;
  --accent-soft: #e3eefb;
  --good: #1f8a4c;
  --good-soft: #e2f4e9;
  --bad: #b8432f;
  --bad-soft: #fbe7e3;
  --line: #d3dce2;
  --balloon: #f2667a;
  --balloon-edge: #c23a50;
  --hand: #f3d2b3;
  --over: #d9822b;
  --up: #7a4fd0;
  --display: "Lexend", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181d; --paper: #1a232a; --ink: #e6edf2; --muted: #9aaab5; --grid: #26323b; --axis: #5d6f7b;
  --parent: #5f707b; --accent: #6aa8f5; --accent-soft: #1d3149; --good: #5cc98a; --good-soft: #17352a;
  --bad: #f08a76; --bad-soft: #3d221d; --line: #2c3a44; --balloon: #e8566c; --balloon-edge: #ffa3b0; --hand: #c9a487; --over: #f0a65a; --up: #ad8cf2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12181d; --paper: #1a232a; --ink: #e6edf2; --muted: #9aaab5; --grid: #26323b; --axis: #5d6f7b;
  --parent: #5f707b; --accent: #6aa8f5; --accent-soft: #1d3149; --good: #5cc98a; --good-soft: #17352a;
  --bad: #f08a76; --bad-soft: #3d221d; --line: #2c3a44; --balloon: #e8566c; --balloon-edge: #ffa3b0; --hand: #c9a487; --over: #f0a65a; --up: #ad8cf2; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lesson { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.dot.on { background: var(--accent); }
.dot.done { background: var(--good); }
h1 { font-family: var(--display); font-size: clamp(24px, 5vw, 32px); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--muted); }
.eq { font-family: var(--display); font-weight: 500; font-size: clamp(22px, 5vw, 30px); text-align: center; padding: 6px 0; }
.eq .a { color: var(--accent); }
.graph { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
canvas { display: block; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; max-width: 560px; margin: 0 auto; }
.legend { display: flex; gap: 18px; justify-content: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; padding-top: 4px; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend .par::before { border-top: 3px dashed var(--parent); }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl label { font-weight: 700; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips .lbl { font-size: 14px; color: var(--muted); margin-right: 2px; }
button { font: inherit; cursor: pointer; }
.chip { background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: 15px; }
.chip:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.q { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.q h2 { font-family: var(--display); font-size: 19px; margin: 0; font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 8px 16px; }
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { min-height: 1.5em; font-weight: 700; }
.fb.right { color: var(--good); }
.fb.wrong { color: var(--bad); }
.nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; }
.btn { background: var(--accent); color: var(--paper); border: 0; border-radius: 8px; padding: 10px 22px; font-family: var(--display); font-weight: 500; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .35; cursor: default; }
.rule { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.rule div { display: flex; gap: 10px; flex-wrap: wrap; }
.rule b { font-family: var(--display); min-width: 9.5em; }
.vin { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 20px; flex-wrap: wrap; }
.vin input { width: 4.2em; font: inherit; font-size: 18px; padding: 4px 8px; border: 2px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); text-align: center; }
.small { font-size: 14px; }
[hidden] { display: none !important; }
p.big { font-size: 21px; line-height: 1.5; }
h1.big { font-size: clamp(28px, 6vw, 38px); }
.graph.mini { max-width: 340px; width: 100%; margin: 0 auto; }
.graph.mid { max-width: 420px; width: 100%; margin: 0 auto; }
.bcap { font-family: var(--display); font-weight: 700; font-size: 22px; text-align: center; color: var(--accent); min-height: 1.4em; }
.notes { background: var(--accent-soft); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.notes h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.checks label { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.checks input { width: 20px; height: 20px; accent-color: var(--good); }
.finish { display: flex; align-items: center; gap: 16px; background: var(--good-soft); border: 2px solid var(--good); border-radius: 10px; padding: 16px; }
.finish b { display: block; font-family: var(--display); font-size: 24px; color: var(--good); }
.badge { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--good); color: var(--paper); display: grid; place-items: center; font-size: 32px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .step { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(6px); } } }

.btn.sm { font-size: 15px; padding: 8px 18px; }
.pat { border-collapse: collapse; width: 100%; max-width: 460px; font-size: 18px; }
.pat th, .pat td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; background: var(--paper); }
.pat th { background: var(--accent-soft); font-family: var(--display); font-size: 15px; }
.pat input { width: 4em; font: inherit; padding: 2px 6px; border: 2px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); text-align: center; }
.pat input.good, .vin input.good { border-color: var(--good); background: var(--good-soft); }
.pat input.badin { border-color: var(--bad); background: var(--bad-soft); }
.legend .ov::before { border-top: 3px dashed var(--over); }
.legend .upk::before { border-top: 3px dashed var(--up); }
.patline { font-family: var(--display); font-size: 18px; text-align: center; max-width: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
canvas.tap { cursor: crosshair; touch-action: manipulation; }
.rule.steps span { line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="lesson">4.2 · Graphing from Vertex Form</div>
    <div class="dots" id="dots"></div>
  </header>
  <main id="step" class="step" style="display:flex;flex-direction:column;gap:16px"></main>
  <div class="nav">
    <button class="btn ghost" id="back">← Back</button>
    <button class="btn" id="next">Next →</button>
  </div>
</div>

<script>
// ---------- helpers ----------
const FR = { "-0.5": "−½", "0.5": "½" };
function fmtA(a) {
  if (a === 1) return "";
  if (a === -1) return "−";
  if (FR[String(a)]) return FR[String(a)];
  return a < 0 ? "−" + (-a) : String(a);
}
function fmtN(v) { // number for display: 0.5 -> ½, -2 -> −2
  const s = Math.abs(v) % 1 === 0.5 ? (Math.abs(v) === 0.5 ? "½" : Math.floor(Math.abs(v)) + "½") : String(Math.abs(v));
  return (v < 0 ? "−" : "") + s;
}
function eqHTML(a, h, k) {
  const A = `<span class="a">${fmtA(a)}</span>`;
  const core = h === 0 ? "x²" : `(x ${h > 0 ? "−" : "+"} ${Math.abs(h)})²`;
  let s = `y = ${A}${core}`;
  if (k !== 0) s += ` ${k > 0 ? "+" : "−"} ${Math.abs(k)}`;
  return s;
}
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function parseNum(s) {
  s = String(s).trim().replace(/−/g, "-").replace(/\s+/g, "").replace("½", "1/2");
  if (s === "") return NaN;
  if (s.includes("/")) { const [p, q] = s.split("/"); return +p / +q; }
  return +s;
}

// ---------- graph ----------
// opts: curves [{a,h,k,parent}], points [{x,y,kind}], pattern {a,h,k,n}
function draw(cv, o) {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const W = Math.max(200, r.width), H = Math.max(200, r.height);
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = 10, sx = x => (x + R) / (2 * R) * W, sy = y => H - (y + R) / (2 * R) * H;
  g.fillStyle = css("--paper"); g.fillRect(0, 0, W, H);
  g.lineWidth = 1; g.strokeStyle = css("--grid");
  for (let i = -R; i <= R; i++) { g.beginPath(); g.moveTo(sx(i), 0); g.lineTo(sx(i), H); g.moveTo(0, sy(i)); g.lineTo(W, sy(i)); g.stroke(); }
  g.strokeStyle = css("--axis"); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(sx(0), 0); g.lineTo(sx(0), H); g.moveTo(0, sy(0)); g.lineTo(W, sy(0)); g.stroke();
  g.fillStyle = css("--muted"); g.font = "11px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "top";
  for (let i = -R + 2; i < R; i += 2) if (i) g.fillText(i, sx(i), sy(0) + 3);
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let i = -R + 2; i < R; i += 2) if (i) g.fillText(i, sx(0) - 4, sy(i));
  for (const c of o.curves || []) {
    g.save(); g.strokeStyle = c.parent ? css("--parent") : css("--accent"); g.lineWidth = c.parent ? 2.5 : 3.5;
    if (c.parent) g.setLineDash([7, 6]);
    g.beginPath(); let first = true;
    for (let px = 0; px <= W; px++) {
      const x = px / W * 2 * R - R, y = c.a * (x - c.h) ** 2 + c.k;
      if (y > R + 2 || y < -R - 2) { first = true; continue; }
      first ? g.moveTo(px, sy(y)) : g.lineTo(px, sy(y)); first = false;
    }
    g.stroke(); g.restore();
  }
  if (o.pattern) {
    const { a, h, k } = o.pattern, n = o.pattern.n || 2;
    g.save(); g.lineWidth = 2.5; g.setLineDash([5, 4]);
    for (let i = 1; i <= n; i++) {
      const y2 = k + a * i * i; if (Math.abs(y2) > R) continue;
      g.strokeStyle = css("--over"); g.beginPath(); g.moveTo(sx(h), sy(k)); g.lineTo(sx(h + i), sy(k)); g.stroke();
      g.strokeStyle = css("--up"); g.beginPath(); g.moveTo(sx(h + i), sy(k)); g.lineTo(sx(h + i), sy(y2)); g.stroke();
    }
    g.restore();
  }
  for (const p of o.points || []) {
    g.fillStyle = p.kind === "wrong" ? css("--bad") : p.kind === "user" ? css("--ink") : p.kind === "vertex" ? css("--accent") : css("--ink");
    g.beginPath(); g.arc(sx(p.x), sy(p.y), p.kind === "vertex" ? 7 : 5.5, 0, 7); g.fill();
  }
  return { sx, sy, W, H, R };
}
const ptsFor = (a, h, k, n = 2) => {
  const out = [{ x: h, y: k, kind: "vertex" }];
  for (let i = 1; i <= n; i++) for (const s of [-1, 1]) { const y = k + a * i * i; if (Math.abs(y) <= 10 && Math.abs(h + s * i) <= 10) out.push({ x: h + s * i, y }); }
  return out;
};

// ---------- question widget ----------
function question(el, prompt, options, correct, why, onRight) {
  const q = document.createElement("div"); q.className = "q";
  q.innerHTML = `<h2>${prompt}</h2><div class="opts"></div><div class="fb" aria-live="polite"></div>`;
  const opts = q.querySelector(".opts"), fb = q.querySelector(".fb");
  let done = false;
  options.forEach(o => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      opts.querySelectorAll(".opt").forEach(x => x.classList.remove("wrong"));
      if (o === correct) { b.classList.add("right"); fb.className = "fb right"; fb.textContent = "Yes! " + why; if (!done) { done = true; onRight && onRight(); } }
      else { b.classList.add("wrong"); fb.className = "fb wrong"; fb.textContent = "Not quite. Look at the graph again and try another answer."; }
    };
    opts.appendChild(b);
  });
  el.appendChild(q);
}

// fill-in pattern table: rows [[over, answer]], label "up"/"down"
function patternQuiz(el, title, rows, dir, why, onRight) {
  const q = document.createElement("div"); q.className = "q";
  q.innerHTML = `<h2>${title}</h2>
    <table class="pat"><thead><tr><th>From the vertex, go…</th><th>Then go ${dir}…</th></tr></thead><tbody></tbody></table>
    <div><button class="btn sm">Check</button></div><div class="fb" aria-live="polite"></div>`;
  const tb = q.querySelector("tbody"), fb = q.querySelector(".fb");
  rows.forEach(([over], i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>over <b>${over}</b></td><td>${dir} <input id="pq${title.length}_${i}" inputmode="decimal" aria-label="${dir} amount for over ${over}"></td>`;
    tb.appendChild(tr);
  });
  let done = false;
  q.querySelector(".btn").onclick = () => {
    const ins = [...tb.querySelectorAll("input")];
    let ok = true;
    ins.forEach((inp, i) => { const good = Math.abs(parseNum(inp.value) - rows[i][1]) < 1e-9; inp.classList.toggle("good", good); inp.classList.toggle("badin", !good); ok = ok && good; });
    fb.className = "fb " + (ok ? "right" : "wrong");
    fb.textContent = ok ? "Yes! " + why : "Not yet. Count the boxes on the graph, starting at the vertex.";
    if (ok && !done) { done = true; onRight && onRight(); }
  };
  el.appendChild(q);
}

// ---------- steps ----------
function stepPattern(el) {
  el.innerHTML = `<h1 class="big">The pattern of y = x²</h1>
    <p class="big">Look at the points on the graph. Start at the <b>vertex</b> (0, 0). Count how far <b>over</b> and how far <b>up</b> you go to reach each point.</p>
    <div class="graph mid"><canvas id="cv"></canvas><div class="legend"><span class="ov">over</span><span class="upk">up</span></div></div>`;
  const cv = el.querySelector("#cv");
  window.__redraw = () => draw(cv, { curves: [{ a: 1, h: 0, k: 0 }], pattern: { a: 1, h: 0, k: 0, n: 3 }, points: ptsFor(1, 0, 0, 3) });
  window.__redraw();
  patternQuiz(el, "Fill in the pattern", [[1, 1], [2, 4], [3, 9]], "up",
    "The pattern is over 1 up 1, over 2 up 4, over 3 up 9. Those are the square numbers! The left side is a mirror image.",
    () => { const n = document.createElement("div"); n.className = "rule"; n.innerHTML = `<div><b>The pattern</b><span>over 1 up 1 · over 2 up 4 · over 3 up 9</span></div><div><b>Works on</b><span>both sides of the vertex (left and right)</span></div>`; el.appendChild(n); });
}

function stepShift(el) {
  const st = { h: 2, k: 4 };
  el.innerHTML = `<h1>Does shifting change the pattern?</h1>
    <p>This graph is shifted. Move the sliders to shift it more. Watch the pattern from the vertex.</p>
    <div class="eq" id="eq"></div>
    <div class="graph mid"><canvas id="cv"></canvas><div class="legend"><span class="ov">over</span><span class="upk">up</span></div></div>
    <div class="ctrl"><label for="sh">Left / right (h): <span id="vh"></span></label><input type="range" id="sh" min="-5" max="5" step="1"></div>
    <div class="ctrl"><label for="sk">Down / up (k): <span id="vk"></span></label><input type="range" id="sk" min="-6" max="4" step="1"></div>
    <p class="patline" id="pl"></p>`;
  const cv = el.querySelector("#cv"), sh = el.querySelector("#sh"), sk = el.querySelector("#sk");
  sh.value = st.h; sk.value = st.k;
  const show = () => {
    el.querySelector("#eq").innerHTML = eqHTML(1, st.h, st.k);
    el.querySelector("#vh").textContent = st.h; el.querySelector("#vk").textContent = st.k;
    el.querySelector("#pl").innerHTML = `Vertex (${st.h}, ${st.k}) · over 1 up 1 · over 2 up 4`;
    draw(cv, { curves: [{ a: 1, h: st.h, k: st.k }], pattern: { a: 1, h: st.h, k: st.k, n: 2 }, points: ptsFor(1, st.h, st.k, 2) });
  };
  sh.oninput = () => { st.h = +sh.value; show(); }; sk.oninput = () => { st.k = +sk.value; show(); };
  window.__redraw = show; show();
  question(el, "Does shifting change the pattern?", ["Yes, the pattern changes", "No, the pattern stays the same"], "No, the pattern stays the same",
    "Shifting only moves the vertex. The pattern is still over 1 up 1, over 2 up 4.");
}

function stepDown(el) {
  const a = -1, h = -3, k = -1;
  el.innerHTML = `<h1>What if it opens down?</h1>
    <p>Here is <b>${eqHTML(a, h, k)}</b>. The a value is −1, so the graph is a reflection. What changed about the pattern?</p>
    <div class="graph mid"><canvas id="cv"></canvas><div class="legend"><span class="ov">over</span><span class="upk">down</span></div></div>`;
  const cv = el.querySelector("#cv");
  window.__redraw = () => draw(cv, { curves: [{ a, h, k }], pattern: { a, h, k, n: 3 }, points: ptsFor(a, h, k, 3) });
  window.__redraw();
  patternQuiz(el, "Fill in the pattern", [[1, 1], [2, 4], [3, 9]], "down",
    "The pattern is the same, just in the opposite direction: over 1 down 1, over 2 down 4, over 3 down 9.");
}

function stepMult(el) {
  const vals = [-3, -2, -1, -0.5, 0.5, 1, 2, 3];
  let a = 2;
  el.innerHTML = `<h1>What does a do to the pattern?</h1>
    <p>Here is <b>y = 2x²</b>. Move the slider to try other values of a. Watch the <b>over</b> numbers and the <b>up</b> numbers.</p>
    <div class="eq" id="eq"></div>
    <div class="graph mid"><canvas id="cv"></canvas><div class="legend"><span class="par">parent y = x²</span><span>your graph</span></div></div>
    <div class="ctrl"><label for="sa">a: <span id="va"></span></label><input type="range" id="sa" min="0" max="${vals.length - 1}" step="1"></div>
    <table class="pat"><thead><tr><th>From the vertex, go…</th><th>Then go…</th></tr></thead><tbody id="pt"></tbody></table>`;
  const cv = el.querySelector("#cv"), sa = el.querySelector("#sa");
  sa.value = vals.indexOf(a);
  const show = () => {
    el.querySelector("#eq").innerHTML = eqHTML(a, 0, 0);
    el.querySelector("#va").textContent = fmtA(a) || "1";
    el.querySelector("#pt").innerHTML = [1, 2, 3].map(i => `<tr><td>over <b>${i}</b></td><td>${a > 0 ? "up" : "down"} <b>${fmtN(Math.abs(a * i * i))}</b> <span class="muted small">(${i * i} × ${fmtN(Math.abs(a))})</span></td></tr>`).join("");
    draw(cv, { curves: [{ a: 1, h: 0, k: 0, parent: true }, { a, h: 0, k: 0 }], points: ptsFor(a, 0, 0, 3) });
  };
  sa.oninput = () => { a = vals[+sa.value]; show(); };
  window.__redraw = show; show();
  question(el, "For y = 2x², from the vertex go over 1. How far up?", ["up 1", "up 2", "up 4"], "up 2", "1 × 2 = 2.",
    () => question(el, "For y = 2x², go over 2. How far up?", ["up 4", "up 6", "up 8"], "up 8", "4 × 2 = 8.",
      () => question(el, "Does a change the <b>over</b> numbers?", ["Yes", "No"], "No",
        "The over numbers (x direction) stay 1, 2, 3. The a value only multiplies the up/down numbers (y direction). That is why we call a the y-multiplier.")));
}

function stepRules(el) {
  el.innerHTML = `<h1>How to graph from vertex form</h1>
    <div class="eq">y = <span class="a">a</span>(x − h)² + k</div>
    <div class="rule steps">
      <div><b>1. Plot the vertex</b><span>(h, k). Watch the sign on h!</span></div>
      <div><b>2. Find a</b><span>a is the y-multiplier</span></div>
      <div><b>3. Use the pattern</b><span>over 1, up 1 × a<br>over 2, up 4 × a<br>over 3, up 9 × a</span></div>
      <div><b>4. Go both ways</b><span>do the pattern to the left and to the right</span></div>
      <div><b>5. If a is negative</b><span>go DOWN instead of up</span></div>
      <div><b>6. Connect the points</b><span>make a smooth "U" shape, not a "V"</span></div>
    </div>
    <p class="muted">You may not always be able to graph the over 3 up 9 point. It might be off the grid!</p>`;
  window.__redraw = null;
}

// ---------- practice ----------
function practice(el, [a, h, k], n, total) {
  el.innerHTML = `<h1>Practice ${n} of ${total}: graph it</h1>
    <div class="eq">${eqHTML(a, h, k)}</div>
    <div class="q" style="border:0;padding:0"><h2>1. What is the vertex?</h2>
      <div class="vin">( <input id="vh" inputmode="numeric" aria-label="x of vertex"> , <input id="vk" inputmode="numeric" aria-label="y of vertex"> )
      <button class="btn sm" id="vchk">Check</button></div>
      <div class="fb" id="vfb" aria-live="polite"></div></div>
    <div id="more"></div>`;
  const vfb = el.querySelector("#vfb"), more = el.querySelector("#more");
  let shown = false;
  window.__redraw = null;
  el.querySelector("#vchk").onclick = () => {
    const H = parseNum(el.querySelector("#vh").value), K = parseNum(el.querySelector("#vk").value);
    if (H === h && K === k) {
      vfb.className = "fb right"; vfb.textContent = `Yes! The vertex is (${h}, ${k}).`;
      if (shown) return; shown = true;
      askA(more, a, () => transforms(more, a, h, k, () => plot(more, a, h, k)));
    } else {
      vfb.className = "fb wrong";
      vfb.textContent = H === -h && K === k && h !== 0 ? "Check the sign on h. (x − h) means the vertex x is +h." : "Not yet. The vertex is (h, k). Look at the number inside the parentheses and the number at the end.";
    }
  };
}

function askA(el, a, onRight) {
  const q = document.createElement("div"); q.className = "q";
  q.innerHTML = `<h2>2. What is a?</h2><p class="small muted">Type a number like 2, −1, or 1/2.</p>
    <div class="vin">a = <input id="ain" aria-label="a value"> <button class="btn sm">Check</button></div><div class="fb" aria-live="polite"></div>`;
  const fb = q.querySelector(".fb"); let done = false;
  q.querySelector(".btn").onclick = () => {
    const v = parseNum(q.querySelector("#ain").value);
    if (Math.abs(v - a) < 1e-9) {
      fb.className = "fb right";
      fb.textContent = `Yes! a = ${fmtN(a)}. ` + (Math.abs(a) === 1 ? "The pattern is the normal 1, 4, 9" : `Multiply the pattern by ${fmtN(Math.abs(a))}: up ${fmtN(Math.abs(a))}, then up ${fmtN(Math.abs(4 * a))}`) + (a < 0 ? ", going DOWN." : ".");
      if (!done) { done = true; onRight(); }
    } else {
      fb.className = "fb wrong";
      fb.textContent = Math.abs(v) === Math.abs(a) ? "Check the sign. Is there a negative in front?" : "Not yet. a is the number in front of the parentheses. If there is no number, a = 1 (or −1 with just a minus sign).";
    }
  };
  el.appendChild(q);
}

function transforms(el, a, h, k, onRight) {
  const H = Math.abs(h) || 3, K = Math.abs(k) || 4;
  const opts = ["Reflection", "Wider (shrink)", "Narrower (stretch)", `Left ${H}`, `Right ${H}`, `Up ${K}`, `Down ${K}`];
  const ans = [];
  if (a < 0) ans.push("Reflection");
  if (Math.abs(a) < 1) ans.push("Wider (shrink)");
  if (Math.abs(a) > 1) ans.push("Narrower (stretch)");
  if (h < 0) ans.push(`Left ${H}`);
  if (h > 0) ans.push(`Right ${H}`);
  if (k > 0) ans.push(`Up ${K}`);
  if (k < 0) ans.push(`Down ${K}`);
  const q = document.createElement("div"); q.className = "q";
  q.innerHTML = `<h2>3. Describe the transformations from y = x²</h2>
    <p class="small muted">Pick every change that happens, then check.</p>
    <div class="opts"></div><div><button class="btn sm">Check</button></div>
    <div class="fb" aria-live="polite"></div>`;
  const box = q.querySelector(".opts"), fb = q.querySelector(".fb"), picked = new Set();
  opts.forEach(o => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = o; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { picked.has(o) ? picked.delete(o) : picked.add(o); b.classList.toggle("sel", picked.has(o)); b.setAttribute("aria-pressed", picked.has(o)); };
    box.appendChild(b);
  });
  let done = false;
  q.querySelector(".btn").onclick = () => {
    const ok = ans.length === picked.size && ans.every(x => picked.has(x));
    if (ok) { fb.className = "fb right"; fb.textContent = "Yes! " + ans.join("; ") + "."; if (!done) { done = true; onRight(); } }
    else {
      const missing = ans.filter(x => !picked.has(x)).length, extra = [...picked].filter(x => !ans.includes(x)).length;
      fb.className = "fb wrong";
      fb.textContent = "Not quite. " + (missing ? `You are missing ${missing}. ` : "") + (extra ? `${extra} of your choices ${extra === 1 ? "does" : "do"} not happen. ` : "") + "Look at a, the number inside the parentheses, and the number at the end.";
    }
  };
  el.appendChild(q);
}

function plot(el, a, h, k) {
  const need = ptsFor(a, h, k, 2);
  const q = document.createElement("div"); q.className = "q";
  q.innerHTML = `<h2>4. Graph it! Tap the grid to plot points.</h2>
    <p class="small">Plot the vertex, then use the pattern to plot <b>2 points on each side</b> (over 1 and over 2). Tap a point again to remove it.</p>
    <div class="graph mid"><canvas id="pc" class="tap"></canvas></div>
    <p class="small muted" id="plist">Your points: none yet</p>
    <div class="chips"><button class="btn sm" id="pchk">Check my graph</button><button class="chip" id="pclr">Clear</button></div>
    <div class="fb" id="pfb" aria-live="polite"></div>`;
  el.appendChild(q);
  const cv = q.querySelector("#pc"), fb = q.querySelector("#pfb"), list = q.querySelector("#plist");
  let pts = [], solved = false, marks = new Set();
  const key = p => p.x + "," + p.y;
  const render = () => {
    const shown = pts.map(p => ({ ...p, kind: marks.has(key(p)) ? "wrong" : "user" }));
    draw(cv, solved ? { curves: [{ a, h, k }], pattern: { a, h, k, n: 2 }, points: shown } : { points: shown });
    list.textContent = "Your points: " + (pts.length ? pts.map(p => `(${fmtN(p.x)}, ${fmtN(p.y)})`).join("  ") : "none yet");
  };
  cv.addEventListener("click", e => {
    if (solved) return;
    const r = cv.getBoundingClientRect();
    const x = Math.round(((e.clientX - r.left) / r.width * 20 - 10));
    const y = Math.round((10 - (e.clientY - r.top) / r.height * 20) * 2) / 2;
    const i = pts.findIndex(p => p.x === x && p.y === y);
    if (i >= 0) pts.splice(i, 1); else pts.push({ x, y });
    marks.clear(); render();
  });
  q.querySelector("#pclr").onclick = () => { if (solved) return; pts = []; marks.clear(); fb.textContent = ""; render(); };
  q.querySelector("#pchk").onclick = () => {
    if (solved) return;
    const onCurve = p => Math.abs(a * (p.x - h) ** 2 + k - p.y) < 1e-9;
    const wrong = pts.filter(p => !onCurve(p));
    const missing = need.filter(n => !pts.some(p => p.x === n.x && p.y === n.y));
    marks = new Set(wrong.map(key));
    if (!wrong.length && !missing.length) {
      solved = true; fb.className = "fb right";
      fb.textContent = "Great graph! All your points are on the parabola. Notice the smooth U shape.";
    } else {
      fb.className = "fb wrong";
      const hasV = pts.some(p => p.x === h && p.y === k);
      fb.textContent = (!hasV ? `Start with the vertex (${h}, ${k}). ` : "") +
        (wrong.length ? `${wrong.length} point${wrong.length > 1 ? "s are" : " is"} not on the graph (shown in red). ` : "") +
        (missing.length ? `You still need ${missing.length} more point${missing.length > 1 ? "s" : ""}. ` : "") +
        `From the vertex: over 1, ${a > 0 ? "up" : "down"} ${fmtN(Math.abs(a))}; over 2, ${a > 0 ? "up" : "down"} ${fmtN(Math.abs(4 * a))}.`;
    }
    render();
  };
  window.__redraw = render; render();
}

function stepEnd(el) {
  el.innerHTML = `<h1>Almost done!</h1>
    <p>You can now graph any parabola from vertex form using the pattern.</p>
    <div class="rule">
      <div><b>Pattern</b><span>over 1 up 1 · over 2 up 4 · over 3 up 9</span></div>
      <div><b>a is the y-multiplier</b><span>multiply the up numbers by a</span></div>
      <div><b>a is negative</b><span>go down instead of up</span></div>
    </div>
    <div class="notes">
      <h2>Make sure your notes are filled out</h2>
      <p>Check off each part of your <b>4-2 Notes Graphing from Vertex Form</b> sheet when it is complete.</p>
      <div class="checks" id="checks"></div>
    </div>
    <div class="finish" id="done" hidden>
      <div class="badge" aria-hidden="true">✓</div>
      <div><b>You are done!</b><span>Show your teacher your completed notes.</span></div>
    </div>
    <p class="muted">Need to fill something in? Tap any dot at the top to go back to that step.</p>`;
  const parts = ["Part 1: The pattern", "Part 2: Shifting", "Part 3: Opens down", "Part 4: a is the y-multiplier", "Part 5: How to graph", "Part 6: Practice (all 6 graphs)"];
  const box = el.querySelector("#checks"), done = el.querySelector("#done");
  const upd = () => { done.hidden = [...box.querySelectorAll("input")].some(c => !c.checked); };
  parts.forEach((p, i) => { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" id="np${i}"> ${p}`; l.querySelector("input").onchange = upd; box.appendChild(l); });
  window.__redraw = null;
}

const PRACTICE = [[1, 5, -3], [1, -1, 4], [-1, 1, 1], [3, 4, -6], [0.5, 3, 4], [-0.5, -2, 5]];
const steps = [stepPattern, stepShift, stepDown, stepMult, stepRules,
  ...PRACTICE.map((e, i) => el => practice(el, e, i + 1, PRACTICE.length)), stepEnd];

// ---------- stepper ----------
let cur = 0;
const main = document.getElementById("step"), dots = document.getElementById("dots"), back = document.getElementById("back"), next = document.getElementById("next");
steps.forEach((_, i) => { const d = document.createElement("button"); d.className = "dot"; d.setAttribute("aria-label", "Step " + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });
function go(i) {
  cur = Math.max(0, Math.min(steps.length - 1, i));
  main.innerHTML = ""; main.classList.remove("step"); void main.offsetWidth; main.classList.add("step");
  steps[cur](main);
  [...dots.children].forEach((d, j) => { d.className = "dot" + (j === cur ? " on" : j < cur ? " done" : ""); });
  back.disabled = cur === 0; next.disabled = cur === steps.length - 1;
  window.scrollTo({ top: 0 });
}
back.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);
window.addEventListener("resize", () => window.__redraw && window.__redraw());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => window.__redraw && window.__redraw());
new MutationObserver(() => window.__redraw && window.__redraw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
go(0);
</script>
</body>
</html>
